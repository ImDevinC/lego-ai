<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Yourself</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FDC800;
      --secondary: #432DD7;
      --success: #16A34A;
      --warning: #D97706;
      --danger: #DC2626;
      --surface: #FBFBF9;
      --text: #1C293C;
      --border: #1C293C;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-offset: 6px;
      --border-w: 3px;
      --radius: 0;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface);
      color: var(--text);
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      background: var(--primary);
      border: var(--border-w) solid var(--border);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border);
      padding: 16px 32px;
      font-size: 27px;
      font-weight: 900;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: -0.02em;
      display: inline-block;
      margin-bottom: 32px;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .card {
      background: #fff;
      border: var(--border-w) solid var(--border);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--border);
      padding: 32px;
      width: 100%;
      max-width: 560px;
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      .header {
        padding: 12px 16px;
        font-size: 21px;
        margin-bottom: 24px;
      }
      .card { padding: 24px 16px; }
    }

    .drop-area {
      border: var(--border-w) dashed var(--border);
      padding: 32px 16px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, box-shadow 0.15s;
      position: relative;
      margin-bottom: 24px;
      background: var(--surface);
    }

    .drop-area.hover,
    .drop-area:hover {
      background: #fff;
      box-shadow: 3px 3px 0 var(--border);
    }

    .drop-area-text {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
      color: var(--text);
    }

    .drop-area-text-small {
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      opacity: 0.55;
      margin: 8px 0 0;
    }

    .drop-area img {
      max-width: 100%;
      max-height: 220px;
      margin-top: 16px;
      border: 2px solid var(--border);
    }

    .field-label {
      font-size: 15px;
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: var(--font-sans);
      border: var(--border-w) solid var(--border);
      background: #fff;
      color: var(--text);
      outline: none;
      transition: box-shadow 0.15s;
      margin-bottom: 24px;
      border-radius: 0;
    }

    .input:focus-visible {
      box-shadow: 3px 3px 0 var(--border);
    }

    .input::placeholder {
      color: var(--text);
      opacity: 0.35;
    }

    .hint {
      font-size: 13px;
      color: var(--text);
      opacity: 0.5;
      margin: -16px 0 24px;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 800;
      font-family: var(--font-sans);
      border: var(--border-w) solid var(--border);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border-radius: 0;
    }

    .btn:active:not(:disabled) {
      transform: translate(3px, 3px);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--secondary);
      color: #fff;
      box-shadow: 4px 4px 0 var(--border);
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 6px 6px 0 var(--border);
    }

    .btn-primary:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    .alert {
      border: var(--border-w) solid var(--border);
      padding: 16px 48px 16px 16px;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
      margin: 24px 0 0;
      font-weight: 500;
    }

    .alert-error {
      background: #fef2f2;
      color: var(--danger);
      border-color: var(--danger);
      box-shadow: 3px 3px 0 var(--danger);
    }

    .alert-info {
      background: #eef2ff;
      color: var(--secondary);
      border-color: var(--secondary);
      box-shadow: 3px 3px 0 var(--secondary);
    }

    .alert .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 21px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      font-weight: 700;
      color: inherit;
    }

    .alert .close-btn:hover {
      opacity: 0.6;
    }

    .output {
      margin-top: 24px;
    }

    .output img {
      max-width: 100%;
      border: var(--border-w) solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(28, 41, 60, 0.06);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .drop-area.loading .loading-overlay {
      display: flex;
    }

    .drop-area.loading .drop-area-text,
    .drop-area.loading .drop-area-text-small {
      opacity: 0.3;
    }

    .brick-loader {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .brick {
      width: 28px;
      height: 20px;
      background: var(--secondary);
      border: 2px solid var(--border);
      position: relative;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .brick::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 4px;
      width: 12px;
      height: 6px;
      background: var(--secondary);
      border: 2px solid var(--border);
      border-bottom: none;
      border-radius: 2px 2px 0 0;
    }

    .brick:nth-child(2) {
      animation-delay: 0.15s;
      background: var(--primary);
    }

    .brick:nth-child(2)::before {
      background: var(--primary);
    }

    .brick:nth-child(3) {
      animation-delay: 0.3s;
    }

    .brick:nth-child(3)::before {
      background: var(--secondary);
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-12px); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

<header class="header">Brick Yourself</header>

<main class="card">
  <div id="drop-area" class="drop-area" role="button" tabindex="0" aria-label="Upload an image">
    <p class="drop-area-text">Drop an image here or click to select.</p>
    <p class="drop-area-text-small">PNG, JPG, WEBP &mdash; max 50 MB</p>
    <input type="file" id="file-input" accept="image/*" hidden>
    <img id="preview" alt="Preview" hidden>
    <div class="loading-overlay">
      <div class="brick-loader" aria-label="Generating" role="status">
        <span class="sr-only">Generating your lego image...</span>
        <div class="brick"></div>
        <div class="brick"></div>
        <div class="brick"></div>
      </div>
    </div>
  </div>

  <label for="api-key" class="field-label">OpenAI API Key</label>
  <input type="password" id="api-key" class="input" placeholder="sk-..." autocomplete="off">
  <p class="hint">Your key is sent directly to OpenAI and never stored on the server. It is saved in your browser for future use.</p>

  <button id="generate-btn" class="btn btn-primary" disabled>
    Generate
  </button>

  <div class="alert alert-error" id="error-alert" hidden>
    <button class="close-btn" id="error-close-btn" aria-label="Dismiss error">&times;</button>
    <span id="error-message"></span>
  </div>

  <div class="alert alert-info" id="info-alert" hidden>
    <button class="close-btn" id="info-close-btn" aria-label="Dismiss message">&times;</button>
    <span id="info-message">Save your image now &mdash; it is not stored on the server.</span>
  </div>

  <input type="hidden" id="prompt" value="">
  <div id="output" class="output"></div>
</main>

<script>
  const dropArea = document.getElementById('drop-area');
  const fileInput = document.getElementById('file-input');
  const previewImg = document.getElementById('preview');
  const apiKeyInput = document.getElementById('api-key');
  const generateBtn = document.getElementById('generate-btn');
  const output = document.getElementById('output');
  const errorContainer = document.getElementById('error-alert');
  const errorCloseBtn = document.getElementById('error-close-btn');
  const errorMessageContainer = document.getElementById('error-message');
  const infoContainer = document.getElementById('info-alert');
  const infoCloseBtn = document.getElementById('info-close-btn');
  const promptInput = document.getElementById('prompt');

  let selectedFile = null;

  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('openai-api-key');
    if (saved) {
      apiKeyInput.value = saved;
      updateButtonState();
    }
  });

  dropArea.addEventListener('click', () => fileInput.click());
  dropArea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));
  errorCloseBtn.addEventListener('click', () => { errorContainer.hidden = true; });
  infoCloseBtn.addEventListener('click', () => { infoContainer.hidden = true; });

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
    dropArea.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
  });
  ['dragenter', 'dragover'].forEach(ev => {
    dropArea.addEventListener(ev, () => dropArea.classList.add('hover'), false);
  });
  ['dragleave', 'drop'].forEach(ev => {
    dropArea.addEventListener(ev, () => dropArea.classList.remove('hover'), false);
  });

  dropArea.addEventListener('drop', e => {
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    if (files.length === 0) return;
    const file = files[0];
    if (!file.type.startsWith('image/')) {
      showError('Please upload an image file.');
      return;
    }
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      previewImg.hidden = false;
    };
    reader.readAsDataURL(file);
    promptInput.value = '';
    updateButtonState();
    errorContainer.hidden = true;
    infoContainer.hidden = true;
  }

  function updateButtonState() {
    generateBtn.disabled = !selectedFile || !apiKeyInput.value.trim();
  }

  apiKeyInput.addEventListener('input', updateButtonState);

  function showError(msg) {
    errorMessageContainer.innerText = msg;
    errorContainer.hidden = false;
  }

  generateBtn.addEventListener('click', async () => {
    if (!selectedFile || !apiKeyInput.value.trim()) return;
    errorContainer.hidden = true;
    infoContainer.hidden = true;
    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';
    dropArea.classList.add('loading');
    fileInput.disabled = true;
    try {
      const formData = new FormData();
      formData.append('image', selectedFile);
      formData.append('apiKey', apiKeyInput.value.trim());
      if (promptInput.value) formData.append('prompt', promptInput.value.trim());
      const res = await fetch('/upload', { method: 'POST', body: formData });
      if (!res.ok) {
        const text = await res.text().catch(() => 'Request failed');
        throw new Error(text || `Server returned ${res.status}`);
      }
      const json = await res.json();
      output.innerHTML = `<img src="data:image/png;base64,${json.image}" alt="Legoified result">`;
      promptInput.value = json.prompt;
      infoContainer.hidden = false;
      localStorage.setItem('openai-api-key', apiKeyInput.value.trim());
    } catch (err) {
      showError(err.message);
    } finally {
      dropArea.classList.remove('loading');
      fileInput.disabled = false;
      generateBtn.disabled = false;
      generateBtn.textContent = promptInput.value ? 'Regenerate' : 'Generate';
    }
  });
</script>

</body>
</html>
